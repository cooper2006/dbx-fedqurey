plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

group = 'com.dbx.agent'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Apache Calcite for federated query execution
    implementation 'org.apache.calcite:calcite-core:1.37.0'
    implementation 'org.apache.calcite:calcite-linq4j:1.37.0'
    
    // JDBC Drivers for federation — bundled in shadow JAR
    // PostgreSQL 系（含 Gaussdb, OpenGauss, Kingbase, Highgo, Uxdb, Vastbase, Kwdb, Oscar）
    implementation 'org.postgresql:postgresql:42.7.1'
    // MySQL 系（含 Doris, StarRocks, Goldendb, Gbase, ManticoreSearch）
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    // SQL Server
    implementation 'com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11'
    // Oracle
    implementation 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'
    // ClickHouse
    implementation 'com.clickhouse:clickhouse-jdbc:0.6.0'
    // IBM DB2
    implementation 'com.ibm.db2:jcc:11.5.9.0'
    // Hive
    implementation 'org.apache.hive:hive-jdbc:3.1.3:standalone'
    // Snowflake
    implementation 'net.snowflake:snowflake-jdbc:3.14.5'
    // Firebird
    implementation 'org.firebirdsql.jdbc:jaybird:5.0.4.java11'
    // Trino
    implementation 'io.trino:trino-jdbc:435'
    // Vertica
    implementation 'com.vertica.jdbc:vertica-jdbc:24.1.0-0'
    // SAP HANA
    implementation 'com.sap.cloud.db.jdbc:ngdbc:2.20.17'
    // Teradata
    implementation 'com.teradata.jdbc:terajdbc4:17.20.00.14'
    // Exasol
    implementation 'com.exasol:exasol-jdbc:7.1.20'
    // Databend
    implementation 'com.databend:databend-jdbc:0.3.10'
    // Informix
    implementation 'com.ibm.informix:jdbc:4.50.10.1'
    // Kylin
    implementation 'org.apache.kylin:kylin-jdbc:4.0.3'
    // MS Access (UCanAccess)
    implementation 'net.sf.ucanaccess:ucanaccess:5.1.2'
    // H2
    implementation 'com.h2database:h2:2.2.224'
    
    // 以下驱动需要手动安装到本地 Maven 仓库或从厂商获取（未在 Maven Central 公开）：
    // - 达梦 (Dameng): dmjdbc.jar — 从 https://eco.dameng.com 下载
    // - 人大金仓 (YashanDB): yasdb-jdbc.jar — 从 https://doc.yashandb.com 下载
    // - 虚谷 (Xugu): xugu_jdbc.jar — 从厂商获取
    // - SunDB: sundb-jdbc.jar — 从 SUNJESOFT 获取
    // - Gbase: gbase-connector-java.jar — 从厂商获取
    // - Goldendb: 使用 MySQL 驱动
    // - Databricks: com.databricks:databricks-jdbc — 从 https://databricks.com/spark/jdbc-drivers-download 下载
    // - BigQuery: com.simba:simba-jdbc — 从 Google Cloud 获取
    // - Spark: com.simba:spark-jdbc — 从厂商获取
    // - 国产 PG 兼容数据库（Gaussdb, OpenGauss 等）: 使用 PostgreSQL 驱动
    
    // JSON processing for RPC
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    
    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

shadowJar {
    archiveBaseName.set('dbx-agent-calcite')
    archiveClassifier.set('')
    archiveVersion.set('')
    
    // Include all dependencies in shadow JAR
    manifest {
        attributes 'Main-Class': 'com.dbx.agent.calcite.CalciteAgent'
    }
    
    // Merge service files
    mergeServiceFiles()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Source sets for Calcite Agent
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}
